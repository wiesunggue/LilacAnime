name: Verify subtitle playback and cancellation

on:
  push:
    branches:
      - feat/android-functional-parity
      - fix/subtitle-lifecycle
      - fix/native-translation-track
      - fix/subtitle-verified-v11
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Load fixed signing key when configured
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LILAC_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lilac-signing.keystore"
            chmod 600 "$RUNNER_TEMP/lilac-signing.keystore"
            echo "LILAC_KEYSTORE_PATH=$RUNNER_TEMP/lilac-signing.keystore" >> "$GITHUB_ENV"
          fi

      - name: Generate Gradle build files from current module configuration
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LilacAnime"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.13.0" apply false
              id("org.jetbrains.kotlin.android") version "2.2.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.2.0" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.lilac.anime"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.lilac.anime.subtitlecheck"
                  testInstrumentationRunner = "com.lilac.anime.player.SubtitleTestRunner"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 40
                  versionName = "0.4.1-alpha-11-subtitle-check"

                  ndk {
                      abiFilters += listOf("arm64-v8a", "x86_64")
                  }
              }

              val fixedKey = System.getenv("LILAC_KEYSTORE_PATH")
              if (!fixedKey.isNullOrBlank()) {
                  signingConfigs.getByName("debug") {
                      storeFile = file(fixedKey)
                      storePassword = requireNotNull(System.getenv("LILAC_STORE_PASSWORD"))
                      keyAlias = requireNotNull(System.getenv("LILAC_KEY_ALIAS"))
                      keyPassword = requireNotNull(System.getenv("LILAC_KEY_PASSWORD"))
                  }
              }
              buildTypes {
                  getByName("debug") {
                      isDebuggable = true
                      isMinifyEnabled = false
                  }
                  getByName("release") {
                      isDebuggable = false
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }

              buildFeatures { compose = true }
              testOptions { unitTests.isIncludeAndroidResources = true }

              packaging {
                  jniLibs {
                      pickFirsts += "**/libc++_shared.so"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.fragment:fragment-ktx:1.8.9")
              implementation("androidx.appcompat:appcompat:1.7.1")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0")
              implementation("androidx.work:work-runtime-ktx:2.10.2")
              implementation("androidx.compose.ui:ui:1.7.0")
              implementation("androidx.compose.ui:ui-tooling-preview:1.7.0")
              debugImplementation("androidx.compose.ui:ui-tooling:1.7.0")
              implementation("androidx.compose.foundation:foundation:1.7.0")
              implementation("androidx.navigation:navigation-compose:2.9.4")
              implementation("io.coil-kt.coil3:coil-compose:3.3.0")
              implementation("io.coil-kt.coil3:coil-network-okhttp:3.3.0")
              implementation("androidx.compose.material3:material3:1.3.0")
              implementation("androidx.compose.material:material-ripple:1.7.0")
              implementation("androidx.compose.material:material-icons-extended:1.6.8")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jsoup:jsoup:1.23.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
              implementation("com.squareup.retrofit2:retrofit:2.11.0")
              implementation("com.squareup.retrofit2:converter-gson:2.11.0")
              implementation("dev.jdtech.mpv:libmpv:1.0.0")
              implementation("io.github.peerless2012:ass:0.5.1")
              implementation("io.github.peerless2012:ass-kt:0.5.1")
              implementation("com.google.android.gms:play-services-cast-framework:22.3.1")
              implementation("androidx.mediarouter:mediarouter:1.8.1")
              implementation("com.google.mlkit:translate:17.0.3")
              testImplementation("junit:junit:4.13.2")
              testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2")
              testImplementation("org.json:json:20240303")
              testImplementation("org.robolectric:robolectric:4.14.1")
              androidTestImplementation("androidx.test:runner:1.6.2")
              androidTestImplementation("androidx.test.ext:junit:1.2.1")
              androidTestImplementation("com.squareup.okhttp3:mockwebserver:4.12.0")
              androidTestImplementation("androidx.test.espresso:espresso-core:3.6.1")
              androidTestImplementation("androidx.compose.ui:ui-test-junit4:1.7.0")
              debugImplementation("androidx.compose.ui:ui-test-manifest:1.7.0")
              implementation(kotlin("stdlib"))
              implementation("com.microsoft.onnxruntime:onnxruntime-android:1.22.0")
              implementation("androidx.media3:media3-exoplayer:1.8.0")
              implementation("androidx.media3:media3-exoplayer-hls:1.8.0")
              implementation("androidx.media3:media3-transformer:1.8.0")
              implementation("androidx.media3:media3-ui:1.8.0")
              implementation("androidx.media3:media3-effect:1.8.0")
          }
          EOF

      - name: Verify bundled Whisper library
        shell: bash
        run: test -s app/src/main/jniLibs/arm64-v8a/liblilac_whisper.so

      - name: Generate deterministic black video fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p app/src/androidTest/assets
          ffmpeg -f lavfi -i color=c=black:s=640x360:r=15:d=20 -c:v mpeg4 -q:v 8 -y app/src/androidTest/assets/black.mp4

      - name: Run JVM regression tests
        env:
          LILAC_STORE_PASSWORD: ${{ secrets.LILAC_ANDROID_STORE_PASSWORD }}
          LILAC_KEY_ALIAS: ${{ secrets.LILAC_ANDROID_KEY_ALIAS }}
          LILAC_KEY_PASSWORD: ${{ secrets.LILAC_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Upload regression test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-parity-test-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build debug APK
        env:
          LILAC_STORE_PASSWORD: ${{ secrets.LILAC_ANDROID_STORE_PASSWORD }}
          LILAC_KEY_ALIAS: ${{ secrets.LILAC_ANDROID_KEY_ALIAS }}
          LILAC_KEY_PASSWORD: ${{ secrets.LILAC_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android UI and native subtitle rendering tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            test_exit=0
            gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon || test_exit=$?
            adb logcat -d -s RealtimeSubtitleTranslator:V LibassTranslationOverlay:V LilacMpv:V AndroidRuntime:E
            mkdir -p subtitle-screen-evidence
            adb pull /sdcard/Pictures/LilacSubtitleEvidence subtitle-screen-evidence/ || test_exit=1
            python3 scripts/emit_subtitle_evidence.py
            exit "$test_exit"

      - name: Upload Android functional test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-device-test-reports
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            subtitle-screen-evidence/
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify APK signature and package metadata
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.LILAC_ANDROID_CERT_SHA256 }}
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > apk-signature.txt
          cat apk-signature.txt
          if [ -n "$LILAC_KEYSTORE_PATH" ]; then
            test -n "$EXPECTED_CERT_SHA256"
            apk_actual_digest=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apk-signature.txt | head -1)
            apk_expected_digest=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
            test "$apk_actual_digest" = "$apk_expected_digest"
            echo "LILAC_PUBLISH_APK=true" >> "$GITHUB_ENV"
          else
            echo "No fixed signing key configured: APK is for CI verification only; publication is disabled."
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > apk-badging.txt
          head -8 apk-badging.txt

      - name: Build arm64 candidate for private local signing
        shell: bash
        run: |
          sed -i 's/abiFilters += listOf("arm64-v8a", "x86_64")/abiFilters += listOf("arm64-v8a")/' app/build.gradle.kts
          gradle :app:assembleDebug --no-daemon
          mkdir -p subtitle-signing-input
          cp app/build/outputs/apk/debug/app-debug.apk subtitle-signing-input/unsigned-candidate.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" subtitle-signing-input/apksigner.jar
          cp apk-badging.txt subtitle-signing-input/tested-build-metadata.txt

      - name: Upload candidate for private local signing
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-ci-candidate-for-local-signing
          path: subtitle-signing-input/
          retention-days: 7

      - name: Collect APK
        if: env.LILAC_PUBLISH_APK == 'true'
        shell: bash
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/LilacAnime-functional-parity-debug.apk
          ls -lh artifacts/

      - name: Upload APK artifact
        if: env.LILAC_PUBLISH_APK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LilacAnime-functional-parity-debug
          path: artifacts/LilacAnime-functional-parity-debug.apk
          if-no-files-found: error
          retention-days: 7
