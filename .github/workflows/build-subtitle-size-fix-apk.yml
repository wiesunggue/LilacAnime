name: Build translated subtitle size fix APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle 9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Apply translated subtitle size fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/kotlin/com/lilac/anime/player/LibassTranslationOverlay.kt")
          s = p.read_text(encoding="utf-8")

          old = "    private var videoTop = 0\n    private var videoWidthPx = 0\n    private var videoHeightPx = 0\n"
          new = old + "    private var subtitleScale = 1.0f\n"
          if old not in s:
              raise SystemExit("LibassTranslationOverlay geometry insertion point not found")
          s = s.replace(old, new, 1)

          old = "    fun setSource(path: String?) {"
          new = """    fun setSubtitleScale(percent: Float) {
              val scale = (percent / 100f).coerceIn(0.5f, 2.0f)
              if (kotlin.math.abs(subtitleScale - scale) < 0.001f) return
              subtitleScale = scale
              renderer?.let { render ->
                  runCatching { render.setFontScale(scale) }
                      .onFailure { Log.e(TAG, "LIBASS_SET_FONT_SCALE_FAILED scale=$scale", it) }
              }
              if (isReady()) scheduleRender()
          }

          fun setSource(path: String?) {"""
          if old not in s:
              raise SystemExit("LibassTranslationOverlay setSource insertion point not found")
          s = s.replace(old, new, 1)

          old = "            r.setStorageSize(w, h)\n            r.setFrameSize(w, h)\n"
          new = old + "            r.setFontScale(subtitleScale)\n"
          if old not in s:
              raise SystemExit("LibassTranslationOverlay renderer insertion point not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          p = Path("app/src/main/kotlin/com/lilac/anime/player/PlayerScreen.kt")
          s = p.read_text(encoding="utf-8")
          old = "    var realtimeSubtitleText by remember { mutableStateOf(\"\") }\n    var libassTranslationOverlay by remember { mutableStateOf<LibassTranslationOverlay?>(null) }\n\n"
          new = old + "    LaunchedEffect(subtitleSize, libassTranslationOverlay) {\n        libassTranslationOverlay?.setSubtitleScale(subtitleSize)\n    }\n\n"
          if old not in s:
              raise SystemExit("PlayerScreen overlay insertion point not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Generate Gradle build files from current module configuration
        shell: bash
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LilacAnime"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.13.0" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.0" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.lilac.anime"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.lilac.anime"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 30
                  versionName = "0.4.1-alpha-3-subtitle-size-fix"

                  ndk {
                      abiFilters += "arm64-v8a"
                  }
                  externalNativeBuild {
                      cmake {
                          cppFlags += listOf("-std=c++17", "-pthread", "-D_GNU_SOURCE", "-DGGML_USE_CPU", "-DGGML_CPU_GENERIC")
                      }
                  }
              }

              buildTypes {
                  getByName("debug") {
                      isDebuggable = true
                      isMinifyEnabled = false
                  }
                  getByName("release") {
                      isDebuggable = false
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
          }

          dependencies {
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.fragment:fragment-ktx:1.8.9")
              implementation("androidx.appcompat:appcompat:1.7.1")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0")
              implementation("androidx.work:work-runtime-ktx:2.10.2")
              implementation("androidx.compose.ui:ui:1.7.0")
              implementation("androidx.compose.ui:ui-tooling-preview:1.7.0")
              debugImplementation("androidx.compose.ui:ui-tooling:1.7.0")
              implementation("androidx.compose.foundation:foundation:1.7.0")
              implementation("androidx.navigation:navigation-compose:2.9.4")
              implementation("io.coil-kt.coil3:coil-compose:3.3.0")
              implementation("io.coil-kt.coil3:coil-network-okhttp:3.3.0")
              implementation("androidx.compose.material3:material3:1.3.0")
              implementation("androidx.compose.material:material-ripple:1.7.0")
              implementation("androidx.compose.material:material-icons-extended:1.6.8")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jsoup:jsoup:1.23.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
              implementation("com.squareup.retrofit2:retrofit:2.11.0")
              implementation("com.squareup.retrofit2:converter-gson:2.11.0")
              implementation("dev.jdtech.mpv:libmpv:1.0.0")
              implementation("io.github.peerless2012:ass:0.5.1")
              implementation("io.github.peerless2012:ass-kt:0.5.1")
              implementation("com.google.android.gms:play-services-cast-framework:22.3.1")
              implementation("androidx.mediarouter:mediarouter:1.8.1")
              implementation("com.google.mlkit:translate:17.0.3")
              implementation(kotlin("stdlib"))
              implementation("com.microsoft.onnxruntime:onnxruntime-android:1.22.0")
              implementation("androidx.media3:media3-exoplayer:1.8.0")
              implementation("androidx.media3:media3-exoplayer-hls:1.8.0")
              implementation("androidx.media3:media3-transformer:1.8.0")
              implementation("androidx.media3:media3-ui:1.8.0")
              implementation("androidx.media3:media3-effect:1.8.0")
          }
          EOF

      - name: Build debug APK
        shell: bash
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/LilacAnime-0.4.1-alpha-3-subtitle-size-fix-debug.apk
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LilacAnime-subtitle-size-fix-debug
          path: artifacts/LilacAnime-0.4.1-alpha-3-subtitle-size-fix-debug.apk
          if-no-files-found: error
          retention-days: 7
